name: Docker Build Cloud

on:
  push:
    branches: ['release/v3.8.51']
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'src/**'
      - 'server/**'
      - 'client/**'
      - 'app/**'
      - '.github/workflows/docker-build-cloud.yml'
  pull_request:
    branches: ['release/v3.8.51']
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'src/**'
      - 'server/**'
      - 'client/**'
      - 'app/**'
      - '.github/workflows/docker-build-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-cloud-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ vars.DOCKER_USER != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Docker Build Cloud
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up FANXORA cloud builder
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: fanxora/stoneai

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
